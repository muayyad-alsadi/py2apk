[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py2apk"
version = "0.1.0"
description = "A CLI tool for building Android APKs from Python source trees"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.scripts]
py2apk = "Py2APK.cli:main"

[tool.setuptools]
packages = ["Py2APK"]
